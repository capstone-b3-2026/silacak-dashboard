services:
  db:
    # Build sendiri dari postgis/postgis + tambah extension timescaledb lewat
    # apt (lihat infra/postgres/Dockerfile). SENGAJA tidak pakai image jadi
    # "timescale/timescaledb-ha" - entrypoint kustomnya sering gagal chown
    # folder data di Docker Desktop for Windows/WSL2 (error umum:
    # "initdb: error: could not change permissions of directory").
    # postgis/postgis pakai entrypoint standar docker-library/postgres yang
    # sudah teruji jalan mulus di semua platform.
    build: ./infra/postgres
    container_name: silacak_db
    restart: always
    environment:
      POSTGRES_DB: silacak
      POSTGRES_USER: silacak
      POSTGRES_PASSWORD: silacak
    ports:
      - "5432:5432"
    volumes:
      - silacak_pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silacak -d silacak"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: silacak_backend
    restart: always
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data   # DEM upload & tile hasil generate fitur Setup - HARUS writable, jangan :ro
      - ./samples:/app/samples:ro   # DEM contoh (dipakai scripts/load_sample_site.py), cukup baca

  frontend:
    build: ./frontend
    container_name: silacak_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  silacak_pgdata: