server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Halaman pengaturan (HTML mandiri milik backend). Tanpa ini, nginx menjawab dengan index.html dashboard
    # sehingga jendela Pengaturan di dalam dashboard menampilkan dashboard di dalam dashboard.
    location ~ ^/(pengaturan|awal|awal-logo\.png)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_buffering off;          # penting buat SSE, jangan di-buffer nginx
        proxy_read_timeout 3600s;     # koneksi SSE dibiarkan nyala lama
        client_max_body_size 200M;    # file DEM GeoTIFF bisa puluhan-ratusan MB
    }
}